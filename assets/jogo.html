<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O cubo do Eliot Muskito</title>
    <link rel="stylesheet" href="../css/jogo.css">
</head>
<body>
    <header class="ui-topo">
        <div id="timer-universal">05:00</div>
        <!--colocar o botão de diário de pistas-->
    </header>
    <main id="game-container">
        <!--porta-->
        <section id="parede-norte" class="cenario ativa">
            <div class="elemento-interativo porta-blindada" id="portaBlindada" onclick="retornarMensagem(this)">porta blindada</div>
            <div class="elemento-interativo painel-porta-pequeno" id="painelPorta" onclick="retornarMensagem(this)">painel porta</div>
            <div class="elemento-interativo mesa-blueprint" onclick="coletarItem(this)" id="bluePrint">Blueprint</div>
            <div class="escondida pop-up" id="painelPortaPopUp">
                <div class="elemento-interativo" id="compartimentoPorta" onclick="retornarMensagem(this)"></div>
                <div class="elemento-interativo" id="terminalJS" onclick="retornarMensagem(this)"></div>
                <div class="fechar elemento-interativo" onclick="retornarMensagem(this)" id="fechaPainelPorta">X</div>
            </div>
        </section>
        <!--quadro de energia-->
        <section id="parede-leste" class="cenario">
            <div class="elemento-interativo quadro-forca" id="quadroDeForca" onclick="retornarMensagem(this)">Quadro de Força</div>
            <div class="pop-up escondida" id="painelQuadroEnergiaPopUp">
                <div class="fechar elemento-interativo" onclick="retornarMensagem(this)" id="fechaQuadro">X</div>
                <div class="quebrado elemento-interativo" onclick="puzzleQuadroForca(this)" id="vermelho"></div>
                <div class="quebrado elemento-interativo" onclick="puzzleQuadroForca(this)" id="azul"></div>
                <div class="quebrado elemento-interativo" onclick="puzzleQuadroForca(this)" id="verde"></div>
            </div>
        </section>
        <!--estante-->
        <section id="parede-oeste" class="cenario">
            <div class="elemento-interativo estante" id="estante" onclick="retornarMensagem(this)">
                Estante de Livros
                <div class="elemento-interativo" id="chaveDeFenda" onclick="coletarItem(this)">Chave de Fenda</div>
                <div class="elemento-interativo" id="gaveta" onclick="retornarMensagem(this)">Gaveta</div>
                <div class="pop-up escondida" id="painelGaveta">
                    <div class="fechar elemento-interativo" onclick="retornarMensagem(this)" id="fechaGaveta">X</div>
                    <div class="elemento-interativo" id="fita" onclick="coletarItem(this)">Rolo de fita</div>
                </div>
            </div>
        </section>
        <!--maquina-->
        <section id="parede-sul" class="cenario">
            <div class="elemento-interativo maquina" id="maquina" onclick="retornarMensagem(this)">Máquina Estranha</div>
        </section>
        <!--teto-->
        <section id="teto" class="cenario">
            <div class="elemento-interativo duto" id="duto" onclick="retornarMensagem(this)">Duto de Ventilação<div class="elemento-interativo" id="parafusos">P</div></div>
        </section>
        
        <div id="navegacao">
            <button class="seta seta-esq" onclick="trocarCenario('esq')">&#9664;</button>
            <button class="seta seta-dir" onclick="trocarCenario('dir')">&#9654;</button>
            <button class="seta seta-cima" onclick="trocarCenario('cima')">&#9650;</button>
            <button class="seta seta-baixo escondida" onclick="trocarCenario('baixo')">&#9660;</button>
        </div>
    </main>

    <footer id="inventario">
        <h3>Inventário</h3>
        <div class="slots">
            <div class="slot vazio" onclick="marcarSlot(this)" id="slot1"></div>
            <div class="slot vazio" onclick="marcarSlot(this)" id="slot2"></div>
            <div class="slot vazio" onclick="marcarSlot(this)" id="slot3"></div>
            <div class="slot vazio" onclick="marcarSlot(this)" id="slot4"></div>
            <div class="slot vazio" onclick="marcarSlot(this)" id="slot5"></div>
        </div>
        <div id="retorno">
        </div>
    </footer>

    <script src="../js/jogo.js"></script>
</body>
</html>
