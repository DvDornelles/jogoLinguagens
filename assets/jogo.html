<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O cubo do Eliot Muskito</title>
    <link rel="stylesheet" href="../css/jogo.css">
    <link rel="stylesheet" href="../css/img.css">

</head>
<body>
    <header class="ui-topo">
        <div id="timer-universal">05:00</div>
        <!--colocar o botão de diário de pistas-->
    </header>
    <main id="game-container">
        <!--porta-->
        <section id="parede-norte" class="cenario ativa">
            <div class="elemento-interativo porta-blindada" id="portaBlindada" onclick="retornarMensagem(this)"></div>
            <div class="elemento-interativo painel-porta-pequeno" id="painelPorta" onclick="retornarMensagem(this)"></div>
            <div class="elemento-interativo mesa-blueprint" onclick="retornarMensagem(this)" id="bluePrint"></div>
            <div class="escondida pop-up" id="painelPortaPopUp">
                <div class="elemento-interativo" id="compartimentoPorta" onclick="retornarMensagem(this)"></div>
                <div class="terminal-JS" id="terminalJS">    
                    <textarea id="input_terminal" placeholder="function abrirPorta() {}&#10;abrirPorta()">function abrirPorta() {&#10;&#10;}&#10;abrirPorta()</textarea>
                    <div class="elemento-interativo" id="enviaCodigoJS" onclick="submeterCod()"></div>
                </div>
                <div class="fechar elemento-interativo" onclick="retornarMensagem(this)" id="fechaPainelPorta">X</div>
            </div>
            <div class="escondida pop-up" id="painelBluePrint">
                <div class="fechar elemento-interativo" onclick="retornarMensagem(this)" id="fechaBluePrint">X</div>
                <div class="elemento-interativo" onclick="transferirBluePrint()" id="transferenciaBP"></div>
                <div>
                    <div class="escondida" id="bpfita"></div>
                    <div class="escondida" id="bpparafusos"></div>
                    <div class="escondida" id="bpbateria"></div>
                    <div class="escondida" id="bpcabos"></div>
                    <div class="escondida" id="bprelogio"></div>
                    <div class="escondida" id="bpdinamite"></div>
                </div>
            </div>
        </section>
        <!--quadro de energia-->
        <section id="parede-leste" class="cenario">
            <div class="elemento-interativo quadro-forca" id="quadroDeForca" onclick="retornarMensagem(this)"></div>
            <div class="pop-up escondida" id="painelQuadroEnergiaPopUp">
                <div class="fechar elemento-interativo" onclick="retornarMensagem(this)" id="fechaQuadro">X</div>
                <div class="quebrado elemento-interativo" onclick="puzzleQuadroForca(this)" id="vermelho"></div>
                <div class="quebrado elemento-interativo" onclick="puzzleQuadroForca(this)" id="azul"></div>
                <div class="quebrado elemento-interativo" onclick="puzzleQuadroForca(this)" id="verde"></div>
            </div>
            <div id="mobilia" class="elemento-interativo" onclick="retornarMensagem(this)"></div>
            <div class="pop-up escondida" id="painelMobilia">
                <div class="fechar elemento-interativo" onclick="retornarMensagem(this)" id="fechaMobilia">X</div>
            </div>
        </section>
        <!--estante-->
        <section id="parede-oeste" class="cenario">
            <div class="elemento-interativo estante" id="estante" onclick="retornarMensagem(this)">
                Estante de Livros
                <div class="elemento-interativo" id="chaveDeFenda" onclick="coletarItem(this)">Chave de Fenda</div>
                <div class="elemento-interativo" id="gaveta" onclick="retornarMensagem(this)">Gaveta</div>
                <div class="pop-up escondida" id="painelGaveta">
                    <div class="fechar elemento-interativo" onclick="retornarMensagem(this)" id="fechaGaveta">X</div>
                    <div class="elemento-interativo" id="fita" onclick="coletarItem(this)">Rolo de fita</div>
                </div>
            </div>
        </section>
        <!--maquina-->
        <section id="parede-sul" class="cenario">
            <div class="elemento-interativo maquina" id="maquina" onclick="retornarMensagem(this)">Máquina Estranha</div>
            <div class="pop-up escondida" id="painelMaquina">
                <div class="fechar elemento-interativo" onclick="retornarMensagem(this)" id="fechaMaquina">X</div>
                <div class="puzzle-area" id="areaPuzzleMaquina">
                    <div class="iniciarMaquina elemento-interativo" id="iniciarPuzzleMaquina" onclick="puzzleMaquina(this)">|></div>
                    <div class="puzzle escondida" id="ordemNumerica">
                        <div class="elemento-interativo blocoMaquina" id="b2" onclick="puzzleMaquina(this)"><p>2³</p></div>
                        <div class="elemento-interativo blocoMaquina" id="b6" onclick="puzzleMaquina(this)"><p>63/3</p></div>
                        <div class="elemento-interativo blocoMaquina" id="b8" onclick="puzzleMaquina(this)"><p>3^3*4</p></div>
                        <div class="elemento-interativo blocoMaquina" id="b5" onclick="puzzleMaquina(this)"><p>10*1,5</p></div>
                        <div class="elemento-interativo blocoMaquina" id="b4" onclick="puzzleMaquina(this)"><p>2*5</p></div>
                        <div class="elemento-interativo blocoMaquina" id="b9" onclick="puzzleMaquina(this)"><p>12^2</p></div>
                        <div class="elemento-interativo blocoMaquina" id="b3" onclick="puzzleMaquina(this)"><p>4+5</p></div>
                        <div class="elemento-interativo blocoMaquina" id="b1" onclick="puzzleMaquina(this)"><p>(4²-9^8)°</p></div>
                        <div class="elemento-interativo blocoMaquina" id="b7" onclick="puzzleMaquina(this)"><p>4^3</p></div>
                    </div>
                </div>
                <div class="cofre" id="cofreMaquina">
                    <div id="bateria" class="escondida elemento-interativo" onclick="retornarMensagem(this)">Bateria</div>
                    <div id="cabos" class="escondida elemento-interativo" onclick="retornarMensagem(this)">Cabos</div>
                </div>
            </div>
        </section>
        <!--teto-->
        <section id="teto" class="cenario">
            <div class="elemento-interativo duto" id="duto" onclick="retornarMensagem(this)">Duto de Ventilação<div class="elemento-interativo" id="parafusos">P</div></div>
        </section>
        
        <nav id="navegacao">
            <button class="seta seta-esq" onclick="trocarCenario('esq')">&#9664;</button>
            <button class="seta seta-dir" onclick="trocarCenario('dir')">&#9654;</button>
            <button class="seta seta-cima" onclick="trocarCenario('cima')">&#9650;</button>
            <button class="seta seta-baixo escondida" onclick="trocarCenario('baixo')">&#9660;</button>
        </nav>
    </main>

    <footer id="inventario">
        <h3>Inventário</h3>
        <div class="slots">
            <div class="slot vazio" onclick="marcarSlot(this)" id="slot1"></div>
            <div class="slot vazio" onclick="marcarSlot(this)" id="slot2"></div>
            <div class="slot vazio" onclick="marcarSlot(this)" id="slot3"></div>
            <div class="slot vazio" onclick="marcarSlot(this)" id="slot4"></div>
            <div class="slot vazio" onclick="marcarSlot(this)" id="slot5"></div>
        </div>
        <div id="retorno">
        </div>
    </footer>

    <script src="../js/jogo.js"></script>
</body>
</html>
