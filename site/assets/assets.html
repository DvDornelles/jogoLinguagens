<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo linguagens</title>
    <link rel="stylesheet" href="/site/css/site.css">
    <link rel="stylesheet" href="../css/assets.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sekuya&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <section id="cabecalhoEsquerda">
            <div id="bLogo" class="botao-cabecalho">
                <img src="../img/logo.jpg" alt="logo da empresa LAVI" id="logo">
            </div>
            <div id="bHome" class="botao-cabecalho" onclick="window.location.href='../../index.html'">
                Home
            </div>
            <div id="bJogar" class="botao-cabecalho" onclick="window.location.href='jogar.html'">
                Jogar
            </div>
            <div id="bHistoria" class="botao-cabecalho" onclick="window.location.href='historia.html'">
                História
            </div>
            <div id="bAssets" class="botao-cabecalho" onclick="window.location.href='assets.html'">
                Assets
            </div>
        </section>
        <section id="cabecalhoDireita">
            <div id="bSobreNos" class="botao-cabecalho" onclick="window.location.href='sobrenos.html'">
                Sobre nós &#128101
            </div>
            <div id="bContato" class="botao-cabecalho" onclick="window.location.href='contato.html'">
                Fale Conosco &#128222
            </div>
        </section>
    </header>
    <main>
        <div id="titulo" class="quadro">
            <h1>Imagens usadas no jogo</h1>
        </div>
        <div class="quadro" id="quadroCenarios">
            <img class="img-quadro img-cenario" id="img1" src="../../jogo/img/parede.norte.png" alt="Cenário da porta de metal do laboratório">
            <img class="img-quadro img-cenario" id="img2" src="../../jogo/img/parede.sul.png" alt="Cenário da parede sul do laboratório">
            <img class="img-quadro img-cenario" id="img3" src="../../jogo/img/parede.leste.png" alt="Cenário da parede leste do laboratório">
            <img class="img-quadro img-cenario" id="img4" src="../../jogo/img/parede.oeste.png" alt="Cenário da parede oeste do laboratório">
            <img class="img-quadro img-cenario" id="img5" src="../../jogo/img/teto.png" alt="Cenário do teto">
        </div>
        <div class="quadro" id="quadroItens">
            <img class="img-quadro img-item" id="img6" src="../../jogo/img/chave.fenda.png" alt="Item: Chave de fenda amarela">
            <img class="img-quadro img-item" id="img7" src="../../jogo/img/cabos.png" alt="Item: Rolo de cabos vermelho e azul">
            <img class="img-quadro img-item" id="img8" src="../../jogo/img/bateria.png" alt="Item: Bateria de 9V">
            <img class="img-quadro img-item" id="img9" src="../../jogo/img/fita.png" alt="Item: Rolo de fita isolante">
            <img class="img-quadro img-item" id="img10" src="../../jogo/img/relogio.png" alt="Item: Relógio de bolso antigo">
            <img class="img-quadro img-item" id="img11" src="../../jogo/img/parafusos.item.png" alt="Item: Parafusos soltos">
            <img class="img-quadro img-item" id="img12" src="../../jogo/img/dinamite.png" alt="Item: Dinamite vermelha">
            <img class="img-quadro img-item" id="img13" src="../../jogo/img/bomba.png" alt="Bomba-relógio finalizada">
            <img class="img-quadro img-item" id="img15" src="../../jogo/img/postit.png" alt="Post-it com anotação">
            <img class="img-quadro img-item" id="img18" src="../../jogo/img/fita.cabos.png" alt="Item: Cabos isolados com fita">
            <img class="img-quadro img-item" id="img26" src="../../jogo/img/relogio.png" alt="Item: Relógio de bolso dourado antigo">
        </div>

        <div class="quadro" id="quadroPopUps">
            <img class="img-quadro img-pop-up" id="img16" src="../../jogo/img/duto.aberto.png" alt="Cenário interativo: Duto de ventilação aberto">
            <img class="img-quadro img-pop-up" id="img17" src="../../jogo/img/estante.png" alt="Cenário: Estante de livros antiga">
            <img class="img-quadro img-pop-up" id="img19" src="../../jogo/img/maquina.aberta.png" alt="Cenário: Máquina com o painel aberto">
            <img class="img-quadro img-pop-up" id="img20" src="../../jogo/img/maquina.png" alt="Cenário: Máquina fechada">
            <img class="img-quadro img-pop-up" id="img21" src="../../jogo/img/mobilia.painel.png" alt="Cenário: Painel de metal com projetos e ferramentas">
            <img class="img-quadro img-pop-up" id="img22" src="../../jogo/img/mobilia.png" alt="Cenário: Mesa de escritório de metal">
            <img class="img-quadro img-pop-up" id="img23" src="../../jogo/img/porta.png" alt="Cenário: Porta de metal trancada com teclado numérico">
            <img class="img-quadro img-pop-up" id="img24" src="../../jogo/img/quadro.forca.aberto.png" alt="Cenário: Quadro de força aberto expondo fios">
            <img class="img-quadro img-pop-up" id="img25" src="../../jogo/img/quadro.forca.png" alt="Cenário: Quadro de força fechado">
            <img class="img-quadro img-pop-up" id="img27" src="../../jogo/img/terminal.aberto.png" alt="Cenário: Terminal tecnológico aberto">
            <img class="img-quadro img-pop-up" id="img28" src="../../jogo/img/terminal.png" alt="Cenário: Terminal tecnológico fechado">
        </div>
    </main>
</body>
</html>
